<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>КотоБара 3D: Выживи 5 минут</title>
    <meta name="viewport" content="width=device-width,user-scalable=no,initial-scale=1,minimum-scale=1,maximum-scale=1,viewport-fit=cover"/>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#5E35B1">
    <meta name="format-detection" content="telephone=no">
    <meta name="renderer" content="webkit"/>
    <meta name="force-rendering" content="webkit"/>
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1"/>
    <meta name="msapplication-tap-highlight" content="no">
    <meta name="full-screen" content="yes"/>
    <meta name="x5-fullscreen" content="true"/>
    <meta name="360-fullscreen" content="true"/>
    <meta name="x5-page-mode" content="app">
    
    <!-- Официальный SDK Пикабу Игр (строго по документации) -->
    <script src="https://games.pikabu.ru/assets/sdk.js"></script>

    <link rel="stylesheet" type="text/css" href="style.f76d1.css"/>
    
    <style>
        /* =========================================================
           БАЗОВЫЕ СТИЛИ: ФИОЛЕТОВЫЙ ЦВЕТ И ЗАЩИТА ОТ ЧЕРНОГО ЭКРАНА
           ========================================================= */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            overscroll-behavior: none;
            background: #5E35B1;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
            -webkit-user-select: none;
            user-select: none;
            touch-action: none;
        }

        #GameDiv, #Cocos3dGameContainer, #GameCanvas {
            width: 100%;
            height: 100%;
            display: block;
            touch-action: none;
            outline: none;
            background-color: #5E35B1 !important;
        }

        /* =========================================================
           ОВЕРЛЕЙ ПОВОРОТА ЭКРАНА
           ========================================================= */
        #orientation-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background-color: #5E35B1;
            z-index: 9999999;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }
        
        @media screen and (orientation: portrait) {
            #orientation-overlay {
                display: flex;
            }
        }

        @keyframes rotateMobilePhone {
            0% { transform: rotate(0deg); }
            30% { transform: rotate(-90deg); }
            70% { transform: rotate(-90deg); }
            100% { transform: rotate(0deg); }
        }

        .vector-phone-icon {
            width: 100px;
            height: 100px;
            animation: rotateMobilePhone 2.5s ease-in-out infinite;
        }
        
        .rotate-text {
            color: #EDE7F6;
            margin-top: 24px;
            font-size: 16px;
            font-weight: 600;
            letter-spacing: 0.5px;
            text-align: center;
            padding: 0 20px;
        }

        /* =========================================================
           ЭКРАН ЗАГРУЗКИ (SPLASH)
           ========================================================= */
        #custom-splash {
            position: fixed;
            inset: 0;
            background-color: #5E35B1;
            z-index: 999999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 0.4s ease-out, visibility 0.4s ease-out;
        }

        @keyframes iconPulse {
            0% { transform: scale(1); filter: drop-shadow(0 4px 14px rgba(0, 0, 0, 0.25)); }
            50% { transform: scale(1.05); filter: drop-shadow(0 8px 24px rgba(0, 0, 0, 0.4)); }
            100% { transform: scale(1); filter: drop-shadow(0 4px 14px rgba(0, 0, 0, 0.25)); }
        }

        .splash-icon {
            width: 110px;
            height: 110px;
            border-radius: 24px;
            object-fit: cover;
            animation: iconPulse 1.8s infinite ease-in-out;
            margin-bottom: 24px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
            border: 2px solid rgba(255, 255, 255, 0.2);
        }

        .splash-progress-track {
            width: 240px;
            height: 8px;
            background-color: rgba(255, 255, 255, 0.2);
            border-radius: 6px;
            overflow: hidden;
            margin-bottom: 14px;
        }

        .splash-progress-fill {
            width: 0%;
            height: 100%;
            background: #EDE7F6;
            border-radius: 6px;
            transition: width 0.1s linear;
        }

        .splash-percent {
            color: #EDE7F6;
            font-size: 15px;
            font-weight: 700;
            margin-bottom: 4px;
            font-variant-numeric: tabular-nums;
        }

        .splash-subtext {
            color: #EDE7F6;
            font-size: 13px;
            letter-spacing: 1px;
            text-transform: uppercase;
            font-weight: 600;
            opacity: 0.9;
        }

        .splash-hidden {
            opacity: 0 !important;
            visibility: hidden !important;
            pointer-events: none !important;
        }
    </style>
</head>
<body>
    <!-- Оверлей поворота устройства -->
    <div id="orientation-overlay">
        <svg class="vector-phone-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect x="6" y="2" width="12" height="20" rx="2" stroke="#EDE7F6" stroke-width="1.5"/>
            <circle cx="12" cy="19" r="0.75" fill="#EDE7F6"/>
            <path d="M4 16C2.5 13.5 2.5 10.5 4 8" stroke="#D1C4E9" stroke-width="1.5" stroke-linecap="round"/>
            <path d="M20 8C21.5 10.5 21.5 13.5 20 16" stroke="#D1C4E9" stroke-width="1.5" stroke-linecap="round"/>
            <path d="M2 10L4 8L6 10" stroke="#D1C4E9" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M22 14L20 16L18 14" stroke="#D1C4E9" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <div class="rotate-text">Поверните устройство горизонтально</div>
    </div>

    <!-- Экран загрузки -->
    <div id="custom-splash">
        <img class="splash-icon" src="index.0e01f.png" alt="КотоБара 3D">
        <div class="splash-progress-track">
            <div class="splash-progress-fill" id="splashFill"></div>
        </div>
        <div class="splash-percent" id="splashPercent">0%</div>
        <div class="splash-subtext">Загрузка игры...</div>
    </div>

    <!-- Контейнер игры Cocos -->
    <div id="GameDiv" cc_exact_fit_screen="true">
        <div id="Cocos3dGameContainer">
            <canvas id="GameCanvas" oncontextmenu="event.preventDefault()" tabindex="0"></canvas>
        </div>
    </div>

    <script src="src/polyfills.bundle.5adbf.js" charset="utf-8"></script>
    <script src="src/system.bundle.543e6.js" charset="utf-8"></script>
    <script src="src/import-map.56a72.json" type="systemjs-importmap" charset="utf-8"></script>

    <script>
        /* =========================================================
           УМНАЯ ЗАГРУЗКА БЕЗ ЧЕРНОГО ЭКРАНА
           ========================================================= */
        let currentProgress = 0;
        let targetProgress = 0;
        let isSceneReady = false;
        
        const fillBar = document.getElementById('splashFill');
        const percentText = document.getElementById('splashPercent');
        const splashScreen = document.getElementById('custom-splash');

        function setProgress(val) {
            currentProgress = Math.min(100, Math.max(currentProgress, val));
            fillBar.style.width = currentProgress + '%';
            percentText.textContent = Math.round(currentProgress) + '%';
        }

        const progressInterval = setInterval(() => {
            if (isSceneReady) return;

            if (targetProgress < 95) {
                targetProgress += (95 - targetProgress) * 0.03 + 0.2;
            }

            if (currentProgress < targetProgress) {
                setProgress(currentProgress + (targetProgress - currentProgress) * 0.15 + 0.3);
            }
        }, 100);

        // Срабатывает ровно тогда, когда сцена 100% отрисована!
        window.__onGameReady = function() {
            if (isSceneReady) return;
            isSceneReady = true;
            clearInterval(progressInterval);
            setProgress(100);

            requestAnimationFrame(() => {
                splashScreen.classList.add('splash-hidden');
                setTimeout(() => {
                    if (splashScreen.parentNode) {
                        splashScreen.parentNode.removeChild(splashScreen);
                    }
                }, 450);
            });
        };

        setTimeout(() => {
            if (window.__onGameReady) window.__onGameReady();
        }, 20000);

        System.import('./index.7d437.js').catch(function(err) {
            console.error("Ошибка загрузки Cocos:", err);
            if (window.__onGameReady) window.__onGameReady();
        });

        /* =========================================================
           TOUCH FIX ДЛЯ МОБИЛОК И ЗАЩИТА CANVAS
           ========================================================= */
        (function () {
            const canvas = document.getElementById('GameCanvas');
            if (!canvas) return;

            document.addEventListener('gesturestart', e => e.preventDefault(), { passive: false });
            document.addEventListener('gesturechange', e => e.preventDefault(), { passive: false });
            document.addEventListener('gestureend', e => e.preventDefault(), { passive: false });

            let lastTouchEnd = 0;
            document.addEventListener('touchend', function (e) {
                const now = Date.now();
                if (now - lastTouchEnd <= 350) e.preventDefault();
                lastTouchEnd = now;
            }, { passive: false });

            document.addEventListener('touchmove', function (e) {
                if (e.touches.length > 1 || (e.scale && e.scale !== 1)) e.preventDefault();
            }, { passive: false });

            document.addEventListener('pointerdown', function (e) {
                if (e.target && e.target.tagName === 'CANVAS') {
                    try { e.target.focus(); } catch (_) {}
                }
            }, { passive: true });
            
            document.addEventListener('touchstart', function (e) {
                if (e.target && e.target.tagName === 'CANVAS') {
                    try { e.target.focus(); } catch (_) {}
                }
            }, { passive: true });

            document.addEventListener('selectstart', function (e) {
                if (e.target && e.target.tagName === 'CANVAS') e.preventDefault();
            });
        })();
    </script>
</body>
</html>
